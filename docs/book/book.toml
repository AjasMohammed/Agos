[book]
title = "AgentOS"
authors = ["AgentOS"]
language = "en"
src = "src"
description = "LLM-native operating system for AI agents — docs, deployment, and reference."

[output.html]
git-repository-url = "https://github.com/agentos/agentos"
edit-url-template = "https://github.com/agentos/agentos/edit/main/docs/book/{path}"
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-icon = "fa-github"

[output.html.fold]
enable = true
level = 1

[output.linkcheck]
follow-web-links = false
warning-policy = "error"
