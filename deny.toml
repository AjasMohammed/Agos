# deny.toml — cargo-deny supply-chain policy for AgentOS.
#
# Enforced in CI (`cargo deny check`) as a mandatory gate on PRs and the release
# path. Covers advisories, license compliance, dependency bans, and source trust.
#
# Release plan: obsidian-vault/plans/production-release-v1/08-security-signoff-and-supply-chain.md

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Kept in LOCKSTEP with `.github/workflows/ci.yml` and `audit.toml`. All four hit
# the same path: rumqttc 0.25.1 transitively pins rustls-webpki 0.102.8, unfixable
# until rumqttc 0.26+ ships. The mqtt feature is opt-in and the affected code
# paths (CRL revocation, name constraints) are not exercised. Re-evaluate on
# rumqttc 0.26+. If you change this list, change audit.toml + ci.yml too.
ignore = [
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # --- Unmaintained transitive crates with no patched release (reviewed 2026-09-18).
    # None is a vulnerability; each is pinned by an upstream we do not control.
    # core2: every version yanked + unmaintained. Pulled by bitstream-io (rav1e /
    # ravif AVIF encoding in `image`) and libflate (include-flate). No replacement
    # until those upstreams migrate.
    "RUSTSEC-2026-0105",
    { crate = "core2@0.4.0", reason = "all versions yanked; pinned by bitstream-io and libflate, see RUSTSEC-2026-0105" },
    # number_prefix: via indicatif (fastembed / hf-hub download progress bars).
    "RUSTSEC-2025-0119",
    # paste: proc-macro only, via rav1e and macro_rules_attribute. Build-time.
    "RUSTSEC-2024-0436",
    # proc-macro-error2: proc-macro only, via include-flate-codegen. Build-time.
    "RUSTSEC-2026-0173",
    # rustls-pemfile: via rumqttc 0.25.1 (opt-in mqtt feature), same upstream
    # block as the four webpki advisories above.
    "RUSTSEC-2025-0134",
    # scc (unsound): dev-dependency only, via serial_test 3.x. Never in a shipped
    # binary. Fix needs scc 3.8.4, which serial_test has not adopted.
    "RUSTSEC-2026-0205",
]

[licenses]
# Seeded from the licenses typically present across the workspace dependency
# tree. This gate is FAIL-CLOSED: `cargo deny check licenses` will flag any
# dependency whose license is not listed here, at which point it must be
# reviewed and either added (with rationale) or the dependency replaced.
# Do NOT add a license here without confirming a real dependency requires it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Added 2026-09-18 after the first real `cargo deny check licenses` run. All
    # are permissive and compatible with shipping under Apache-2.0:
    "MIT-0",                # borrow-or-share (jsonschema URI handling)
    "0BSD",                 # quoted_printable (mail parsing)
    "CDLA-Permissive-2.0",  # webpki-roots / webpki-root-certs (Mozilla CA bundle data)
    "NCSA",                 # libfuzzer-sys: "(MIT OR Apache-2.0) AND NCSA", fuzz-only
]
confidence-threshold = 0.9
# Per-crate license exceptions go here, each with a written rationale:
# exceptions = [{ allow = ["..."], name = "some-crate" }]

[bans]
# Start permissive on duplicate versions (the tree has some); tighten to "deny"
# post-v1 once deduplicated. Wildcard version requirements are never allowed.
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates reference each other by path with no version. They are all
# `publish = false` (see [workspace.package]), so this is safe; registry
# wildcards (`foo = "*"`) are still denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
