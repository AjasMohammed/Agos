tags = ["write", "fs"]

[manifest]
name        = "file-writer"
version     = "1.1.0"
description = "Writes content to files with exclusive locking, atomic overwrite, append, and create_only modes. Blocks concurrent readers and writers with a FileLocked error."
author      = "agentos-core"
trust_tier  = "core"
risk_class  = "write_scoped"

[capabilities_required]
permissions = ["fs.user_data:w"]

[capabilities_provided]
outputs = ["status"]

[intent_schema]
input  = "FileWriteIntent"
output = "WriteResult"

[payload_schema]
type = "object"
required = ["path", "content"]

[payload_schema.properties.path]
type = "string"
description = "Relative file path under data directory"

[payload_schema.properties.content]
type = "string"
description = "Text content to write"

[payload_schema.properties.mode]
type = "string"
enum = ["overwrite", "append", "create_only"]
default = "overwrite"
description = "Write mode"

[payload_schema.properties.append]
type = "boolean"
default = false
description = "Legacy alias for mode=append"

[payload_schema.properties.max_bytes]
type = "integer"
default = 10485760
minimum = 1
description = "Maximum allowed content size in bytes"

[sandbox]
network       = false
fs_write      = true
gpu           = false
max_memory_mb = 64
max_cpu_ms    = 5000
syscalls      = []

[usage_hints]
use_for = [
  "creating a new file or fully replacing one whose content you've already read",
]
prefer_over = [
  "shell-exec for redirection — typed errors and atomic writes",
  "file-edit when you intend to overwrite the entire file",
]
related_tools = ["file-reader", "file-edit"]

[[examples]]
description = "Write text content to a new file"
[examples.payload]
path = "notes.txt"
content = "Meeting notes from 2026-06-01"
