tags = ["meta", "read"]

[manifest]
name = "hardware-get-twin"
version = "1.0.0"
description = "Get the device twin (desired + reported state) for an IoT device. Shows what the agent wants vs. what the sensor reports."
author = "agentos-core"
trust_tier = "core"
risk_class = "readonly_scoped"
tags = ["iot", "hardware"]

[capabilities_required]
permissions = ["hardware.iot:r"]

[capabilities_provided]
outputs = ["device_id", "desired_state", "reported_state", "reconciled"]

[intent_schema]
input = "HardwareGetTwinIntent"
output = "HardwareGetTwinResult"

[payload_schema]
type     = "object"
required = ["device_id"]

[payload_schema.properties.device_id]
type        = "string"
description = "Stable device identifier as registered with the kernel's IoT registry."

[sandbox]
network = false
fs_write = false
max_memory_mb = 32
max_cpu_ms = 5000
