tags = ["meta", "read"]

[manifest]
name        = "agent-messages-read"
version     = "1.0.0"
description = "Read a single direct message by ID and mark it as read."
author      = "agentos-core"
trust_tier  = "core"
risk_class  = "readonly_scoped"

[capabilities_required]
permissions = []

[capabilities_provided]
outputs = ["id", "from", "from_agent_id", "body", "created_at"]

[intent_schema]
input  = "AgentMessagesReadIntent"
output = "AgentMessagesReadResult"

[payload_schema]
type     = "object"
required = ["id"]

[payload_schema.properties.id]
type        = "string"
description = "Message ID from agent-messages-list"

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 8
max_cpu_ms    = 500
syscalls      = []
