tags = ["write"]

[manifest]
name = "container-destroy"
version = "1.0.0"
description = "Destroy a container, stopping it if running and removing all resources."
author = "agentos-core"
trust_tier = "core"
risk_class = "exec_capable"
tags = ["compute", "container"]

[capabilities_required]
permissions = ["container.destroy:x"]

[capabilities_provided]
outputs = ["destroyed"]

[intent_schema]
input = "ContainerDestroyIntent"
output = "ContainerDestroyResult"

[payload_schema]
type     = "object"
required = ["container_id"]

[payload_schema.properties.container_id]
type        = "string"
description = "Container ID returned by container-create."

[sandbox]
network = false
fs_write = false
max_memory_mb = 32
max_cpu_ms = 15000
