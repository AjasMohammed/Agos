tags = ["write", "fs"]
risk_class = "write_scoped"

[manifest]
name        = "file-editor"
version     = "1.0.0"
description = "Applies exact string replacements to a file. Relative paths resolve under the agent's own home dir; absolute paths are accepted inside operator-granted host folders (see agent-self granted_folders or the ## Files prompt block). Acquires an exclusive write lock for the full read-modify-write cycle. Each edit must match exactly once — errors if old_text is not found or is ambiguous — unless that edit sets replace_all=true, which replaces every occurrence (use it for renames). The previous version is kept in .trash/ for ~72h and its path returned as \"backup\"."
author      = "agentos-core"
trust_tier  = "core"
category    = "fs"
search_hints = ["edit a file in place", "replace text in a file", "patch a file"]

[capabilities_required]
permissions = ["fs.user_data:w", "fs.workspace:w"]

[capabilities_provided]
outputs = ["status"]

[intent_schema]
input  = "FileEditIntent"
output = "FileEditResult"

[payload_schema]
type = "object"
required = ["path", "edits"]

[payload_schema.properties.path]
type = "string"
description = "File path: relative (under your home dir) or absolute inside a write-granted folder"

[payload_schema.properties.edits]
type = "array"
minItems = 1
description = "Ordered text replacement operations"

[payload_schema.properties.edits.items]
type = "object"
required = ["old_text", "new_text"]

[payload_schema.properties.edits.items.properties.old_text]
type = "string"
description = "Unique text to replace"

[payload_schema.properties.edits.items.properties.new_text]
type = "string"
description = "Replacement text"
[payload_schema.properties.edits.items.properties.replace_all]
type = "boolean"
default = false
description = "Replace every occurrence of old_text instead of requiring exactly one"

[sandbox]
network       = false
fs_write      = true
gpu           = false
max_memory_mb = 64
max_cpu_ms    = 5000
syscalls      = []

[[examples]]
description = "Replace a specific string in a file"
[examples.payload]
path = "config.toml"
[[examples.payload.edits]]
old_text = "host = \"localhost\""
new_text = "host = \"0.0.0.0\""
