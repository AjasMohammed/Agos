[manifest]
name        = "channel-send"
version     = "1.0.0"
description = "Send a message to one connected channel (Telegram, Slack, …). Pick by display name or ID. The agent's connected channels are listed in its system prompt under '## Channels'. Per-platform features: 'agent-manual section=channel-<kind>'. Distinct from notify-user, which fans out to all delivery adapters."
author      = "agentos-core"
trust_tier  = "core"
risk_class  = "exec_capable"
tags        = ["write", "network", "channel"]

[capabilities_required]
permissions = ["channel.send:w"]

[capabilities_provided]
outputs = ["message_id", "channel", "kind", "delivered_at"]

[intent_schema]
input  = "ChannelSendIntent"
output = "ChannelSendResult"

[input_schema]
type = "object"
required = ["channel", "text"]

[input_schema.properties.channel]
type        = "string"
description = "Display name (e.g. 'telegram-main') or ChannelInstanceID. Channels are listed in the system prompt and via 'agent-manual section=channels'."

[input_schema.properties.text]
type        = "string"
description = "Message body. Markdown rendering is platform-aware: Telegram converts to HTML, Slack uses mrkdwn, Discord/Matrix pass through. See 'agent-manual section=channel-<kind>' for platform-specific syntax."

[input_schema.properties.thread_id]
type        = "string"
description = "Optional thread or reply target — platform-specific format (Slack ts, Discord thread id, Matrix event id)."

[sandbox]
network       = true
fs_write      = false
gpu           = false
max_memory_mb = 16
max_cpu_ms    = 5000
syscalls      = []
