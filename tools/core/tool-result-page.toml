tags = ["meta", "read"]

[manifest]
name        = "tool-result-page"
version     = "1.0.0"
description = "Retrieve a paged section of a previously truncated tool result. Use this when an earlier tool result was truncated and the response included a 'page_id=...' hint."
author      = "agentos-core"
trust_tier  = "core"
risk_class  = "readonly_scoped"

[capabilities_required]
permissions = []

[capabilities_provided]
outputs = ["content.text"]

[intent_schema]
input  = "ToolResultPageQuery"
output = "ToolResultPage"

[payload_schema]
type = "object"
required = ["page_id"]

[payload_schema.properties.page_id]
type = "string"
description = "The page_id from the truncated tool result, e.g. 'overflow-1234-...'."

[payload_schema.properties.offset]
type = "integer"
default = 0
description = "Character offset to start reading from (default 0)."

[payload_schema.properties.length]
type = "integer"
default = 4000
description = "Number of characters to return (max 8000)."

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 16
max_cpu_ms    = 1000
syscalls      = []
