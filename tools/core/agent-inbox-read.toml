tags = ["read"]
risk_class = "readonly_scoped"

[manifest]
name        = "agent-inbox-read"
version     = "1.0.0"
description = "Read a single inbox notification by ID, returning its full body. Marks the entry as read."
author      = "agentos-core"
trust_tier  = "core"
category    = "agent"
search_hints = ["read an inbox message", "open a message sent to me"]

[capabilities_required]
permissions = []

[capabilities_provided]
outputs = ["id", "kind", "title", "body", "created_at"]

[intent_schema]
input  = "AgentInboxReadIntent"
output = "AgentInboxReadResult"

[payload_schema]
type     = "object"
required = ["id"]

[payload_schema.properties.id]
type        = "string"
description = "Inbox entry ID from agent-inbox-list"

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 8
max_cpu_ms    = 500
syscalls      = []
