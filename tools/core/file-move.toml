tags = ["write", "fs"]
risk_class = "write_scoped"

[manifest]
name        = "file-move"
version     = "1.0.0"
description = "Moves or renames a file. Both source and destination must be under your home dir or inside a write-granted folder. Relative paths resolve under the agent's own home dir; absolute paths are accepted inside operator-granted host folders (see agent-self granted_folders or the ## Files prompt block). Acquires write lock on source, creates destination parent directories automatically."
author      = "agentos-core"
trust_tier  = "core"
category    = "fs"

[capabilities_required]
permissions = ["fs.user_data:w", "fs.workspace:w"]

[capabilities_provided]
outputs = ["status"]

[intent_schema]
input  = "FileMoveIntent"
output = "FileMoveResult"

[payload_schema]
type = "object"
required = ["from", "to"]

[payload_schema.properties.from]
type = "string"
description = "Source file path"

[payload_schema.properties.to]
type = "string"
description = "Destination file path"

[sandbox]
network       = false
fs_write      = true
gpu           = false
max_memory_mb = 16
max_cpu_ms    = 2000
syscalls      = []
