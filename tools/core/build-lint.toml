tags = ["exec"]
risk_class = "exec_capable"

[manifest]
name = "build-lint"
version = "1.0.0"
description = "Run linter with auto-detected ecosystem (clippy/eslint/flake8)"
author = "agentos-core"
trust_tier = "core"
category    = "capabilities"

[capabilities_required]
permissions = ["build.lint:x"]

[capabilities_provided]
outputs = ["content.json"]

[intent_schema]
input = "BuildLintIntent"
output = "BuildLintResult"

[payload_schema]
type = "object"

[payload_schema.properties.working_dir]
description = "Project directory (auto-detects linter from Cargo.toml, package.json, etc.)"
type = "string"

[payload_schema.properties.allow_network]
description = "Share the host network with the command (default false). Requires net.outbound:x. Commands otherwise run offline in a sandbox that sees only the agent home, its managed workspaces, and folders granted with --mode rwx."
type = "boolean"

[sandbox]
network = false
fs_write = false
gpu = false
max_memory_mb = 512
max_cpu_ms = 60000
syscalls = []

[executor]
type = "inline"
