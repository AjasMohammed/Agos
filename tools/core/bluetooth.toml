tags = ["read", "write", "network"]

[manifest]
name        = "bluetooth"
version     = "1.0.0"
description = "Scan, pair, connect, disconnect, and perform GATT read/write operations via the HAL bluetooth driver."
author      = "agentos-core"
trust_tier  = "core"
risk_class  = "control_plane"

[capabilities_required]
permissions = [
  "hardware.bluetooth.list:r",
  "hardware.bluetooth.scan:o",
  "hardware.bluetooth.pair:x",
  "hardware.bluetooth.connection:x",
  "hardware.bluetooth.gatt:r",
  "hardware.bluetooth.gatt:w",
]

[capabilities_provided]
outputs = ["hardware.bluetooth", "content.structured"]

[intent_schema]
input  = "BluetoothIntent"
output = "BluetoothResult"

[payload_schema]
type = "object"
description = "Bluetooth operation request"

[payload_schema.properties.action]
type = "string"
enum = ["list_adapters", "scan", "pair", "connect", "disconnect", "gatt_read", "gatt_write"]
default = "list_adapters"
description = "Bluetooth action to execute."

[payload_schema.properties.adapter]
type = "string"
description = "Optional adapter name (for example hci0)."

[payload_schema.properties.duration_seconds]
type = "integer"
minimum = 1
maximum = 30
description = "Scan duration in seconds for action='scan'."

[payload_schema.properties.address]
type = "string"
description = "Bluetooth MAC address (AA:BB:CC:DD:EE:FF) for pair/connect/disconnect/GATT actions."

[payload_schema.properties.service_uuid]
type = "string"
description = "Service UUID for GATT operations."

[payload_schema.properties.characteristic_uuid]
type = "string"
description = "Characteristic UUID for GATT operations."

[payload_schema.properties.value]
type = "array"
description = "Byte-array payload for gatt_write."
items = { type = "integer", minimum = 0, maximum = 255 }

[payload_schema.properties.value_base64]
type = "string"
description = "Base64 payload alternative for gatt_write."

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 256
max_cpu_ms    = 20000
syscalls      = []

[[examples]]
description = "List adapters"
payload = { action = "list_adapters" }

[[examples]]
description = "Scan for nearby devices"
payload = { action = "scan", duration_seconds = 8 }

[[examples]]
description = "Connect to a paired device"
payload = { action = "connect", address = "AA:BB:CC:DD:EE:FF" }
