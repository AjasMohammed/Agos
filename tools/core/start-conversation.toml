[manifest]
name        = "start-conversation"
version     = "1.0.0"
description = "Start a live multi-agent conversation between two or more registered agents on a given topic. The agents will take turns responding to each other. The conversation can be watched live in the Web UI at /agent-chat/{convo_id}."
author      = "agentos-core"
trust_tier  = "core"
group       = "coordination"
risk_class  = "control_plane"

[capabilities_required]
permissions = ["agent.spawn:x"]

[capabilities_provided]
outputs = ["convo_id", "url"]

[intent_schema]
input  = "StartConversationIntent"
output = "StartConversationResult"

[input_schema]
type = "object"
required = ["topic", "participants"]

[input_schema.properties.topic]
type = "string"
description = "The topic or prompt that drives the conversation between the agents."

[input_schema.properties.participants]
type = "array"
items = { type = "string" }
minItems = 2
maxItems = 8
description = "List of agent names to include in the conversation (2–8 agents, must be unique)."

[input_schema.properties.max_turns]
type = "integer"
default = 6
minimum = 2
maximum = 50
description = "Maximum number of turns before the conversation ends automatically. Default: 6."

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 8
max_cpu_ms    = 500
syscalls      = []
