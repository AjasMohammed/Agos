tags = ["meta", "read"]

[manifest]
name        = "sys-monitor"
version     = "1.0.0"
risk_class  = "readonly_scoped"
description = "Return live system monitoring stats (CPU load, memory usage, process counts) via the Hardware Abstraction Layer."
author      = "agentos-core"
trust_tier  = "core"

[manifest.usage_hints]
use_for = ["Checking current CPU/memory load", "Lightweight host health snapshot"]
prefer_over = ["shell-exec top", "shell-exec free", "shell-exec uptime"]
quick_example = {}

[capabilities_required]
permissions = ["hardware.system:r"]

[capabilities_provided]
outputs = ["content.structured"]

[intent_schema]
input  = "SysMonitorQuery"
output = "SysMonitorResult"

[payload_schema]
type = "object"
description = "No input required"

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 64
max_cpu_ms    = 5000
syscalls      = []
