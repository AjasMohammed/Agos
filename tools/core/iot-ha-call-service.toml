tags = ["write", "network"]

[manifest]
name = "iot-ha-call-service"
version = "1.0.0"
risk_class  = "control_plane"
description = "Call a Home Assistant service (e.g., turn_on, set_temperature) to control smart home devices."
author = "agentos-core"
trust_tier = "core"
tags = ["iot", "homeassistant", "hardware"]

[capabilities_required]
permissions = ["hardware.homeassistant:w"]

[capabilities_provided]
outputs = ["result"]

[intent_schema]
input = "IotHaCallServiceIntent"
output = "IotHaCallServiceResult"

[payload_schema]
type     = "object"
required = ["domain", "service"]

[payload_schema.properties.domain]
type        = "string"
description = "Home Assistant service domain (e.g. 'light', 'climate', 'switch')."

[payload_schema.properties.service]
type        = "string"
description = "Service name within the domain (e.g. 'turn_on', 'set_temperature')."

[payload_schema.properties.entity_id]
type        = "string"
description = "Target entity (e.g. 'light.kitchen'). Some services accept lists; pass a comma-separated string for those."

[payload_schema.properties.service_data]
type                 = "object"
additionalProperties = true
description          = "Service-specific arguments (e.g. {brightness: 200, color_name: 'red'})."

[sandbox]
network = false
fs_write = false
max_memory_mb = 32
max_cpu_ms = 10000
