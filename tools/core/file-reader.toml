tags = ["read", "fs"]
risk_class = "readonly_external"

[manifest]
name        = "file-reader"
version     = "1.1.0"
description = "Reads files and lists directories with line-based pagination. Relative paths resolve under the agent's own home dir; absolute paths are accepted inside operator-granted host folders (see agent-self granted_folders or the ## Files prompt block). Respects write locks — returns FileLocked if another agent is writing."
author      = "agentos-core"
trust_tier  = "core"
category    = "fs"
search_hints = ["read a file", "open config", "cat a path", "show file contents"]

[capabilities_required]
permissions = ["fs.user_data:r", "fs.workspace:r"]

[capabilities_provided]
outputs = ["content.text"]

[intent_schema]
input  = "FileReadIntent"
output = "FileContent"

[payload_schema]
type = "object"
required = ["path"]

[payload_schema.properties.path]
type = "string"
description = "Path to file or directory: relative (under your home dir) or absolute inside a granted folder"

[payload_schema.properties.mode]
type = "string"
enum = ["read", "list"]
default = "read"
description = "read for file content, list for directory listing"

[payload_schema.properties.offset]
type = "integer"
default = 0
minimum = 0
description = "Line offset to start reading from"

[payload_schema.properties.limit]
type = "integer"
default = 500
minimum = 0
description = "Maximum lines to return; 0 means no limit"

# A non-UTF-8 file is retried through an external converter (pdftotext,
# soffice), which forks and writes to a private temp dir. That path is capped at
# 20s wall clock and 5 MiB of output by agentos-tools::extract.
[sandbox]
network       = false
fs_write      = true
gpu           = false
max_memory_mb = 512
max_cpu_ms    = 30000
syscalls      = []

[usage_hints]
use_for = [
  "reading existing file content before deciding what to change",
  "listing a directory before reading individual files",
]
prefer_over = ["shell-exec for cat/ls — typed errors and pagination"]
related_tools = ["file-writer", "file-editor", "file-glob"]

[[examples]]
description = "Read the first 100 lines of a config file"
[examples.payload]
path = "config.toml"
mode = "read"
limit = 100
offset = 0
