[manifest]
name = "storage-zone-list"
version = "1.0.0"
description = "List active storage zones for this agent"
author = "agentos-core"
trust_tier = "core"
risk_class = "readonly_scoped"

[capabilities_required]
permissions = [
    "storage.zone.list:r",
]

[capabilities_provided]
outputs = ["content.json"]

[intent_schema]
input = "StorageZoneListIntent"
output = "StorageZoneListResult"

[input_schema]
type = "object"

[sandbox]
network = false
fs_write = false
gpu = false
max_memory_mb = 64
max_cpu_ms = 5000
syscalls = []

[executor]
type = "inline"
