tags = ["read"]

[manifest]
name = "container-logs"
version = "1.0.0"
description = "Read stdout/stderr logs from a running or stopped container."
author = "agentos-core"
trust_tier = "core"
tags = ["compute", "container"]

[capabilities_required]
permissions = ["container.logs:r"]

[capabilities_provided]
outputs = ["logs"]

[intent_schema]
input = "ContainerLogsIntent"
output = "ContainerLogsResult"

[payload_schema]
type     = "object"
required = ["container_id"]

[payload_schema.properties.container_id]
type        = "string"
description = "Container ID returned by container-create."

[payload_schema.properties.tail]
type        = "integer"
minimum     = 0
default     = 200
description = "Number of trailing log lines to return; 0 means no limit."

[sandbox]
network = false
fs_write = false
max_memory_mb = 32
max_cpu_ms = 5000
