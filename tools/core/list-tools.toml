tags = ["meta", "read"]
risk_class = "readonly_scoped"

[manifest]
name        = "list-tools"
version     = "1.0.0"
description = "List available tools with pagination. Filter by category or tag."
author      = "agentos-core"
trust_tier  = "core"
search_hints = ["browse available tools", "what tools are in a category", "page through the catalogue"]
tags        = ["meta", "read"]

[capabilities_required]
permissions = []

[capabilities_provided]
outputs = ["content.structured"]

[intent_schema]
input  = "ToolListQuery"
output = "ToolListPage"

[payload_schema]
type = "object"

[payload_schema.properties.category]
type = ["string", "null"]
description = "Optional category filter such as filesystem, memory, network, or coordination. Omit, or pass null or \"\", for no filter."

[payload_schema.properties.tag]
type = ["string", "null"]
description = "Optional tag filter: read, write, exec, network, fs, or meta. Omit, or pass null or \"\", for no filter."

[payload_schema.properties.page]
type = "integer"
minimum = 0
default = 0
description = "Zero-based page index — the first page is 0, not 1. A page past the end serves the last page."

[payload_schema.properties.page_size]
type = "integer"
minimum = 1
maximum = 50
default = 20

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 16
max_cpu_ms    = 1000
syscalls      = []
