tags = ["meta", "write"]

[manifest]
name        = "event-subscribe"
version     = "1.0.0"
description = "Subscribe the calling agent to kernel events matching a filter. Permission-gated per event category — use event-list-available to discover which categories you can subscribe to."
author      = "agentos-core"
trust_tier  = "core"

[capabilities_required]
permissions = ["events.stream:o"]

[capabilities_provided]
outputs = ["subscription_id", "status"]

[intent_schema]
input  = "EventSubscribeIntent"
output = "EventSubscribeResult"

[payload_schema]
type     = "object"
required = ["event_filter"]

[payload_schema.properties.event_filter]
type        = "string"
description = "What to subscribe to. Forms: 'all' (root only), 'category:<Name>' (e.g. 'category:HardwareEvents'), or an exact event type like 'DeviceConnected'."

[payload_schema.properties.payload_filter]
type        = "string"
description = "Optional predicate evaluated against the event payload, e.g. \"severity == 'critical'\" or \"agent_id == 'agent-7'\"."

[payload_schema.properties.throttle]
type        = "string"
description = "Rate-limit policy. Forms: 'none', 'once_per:30s', 'max:5/60s'. Default: 'none'."

[payload_schema.properties.priority]
type        = "string"
description = "Delivery priority: 'critical', 'high', 'normal' (default), or 'low'."

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 16
max_cpu_ms    = 500
syscalls      = []
