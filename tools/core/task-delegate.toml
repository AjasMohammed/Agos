tags = ["exec"]
risk_class = "control_plane"

[manifest]
name        = "task-delegate"
version     = "1.0.0"
description = "Delegate a sub-task to a named agent and BLOCK until it finishes. Your task is paused and automatically resumed with the child's output in your context. Use spawn-async instead if you must keep working while the child runs."
author      = "agentos-core"
trust_tier  = "core"
category    = "agent"
search_hints = ["hand this task to another agent", "delegate a task"]

[capabilities_required]
permissions = ["agent.message:x"]

[capabilities_provided]
outputs = ["status"]

[intent_schema]
input  = "TaskDelegateIntent"
output = "DelegateResult"

[payload_schema]
type = "object"
required = ["agent", "task"]

[payload_schema.properties.agent]
type = "string"
description = "Target agent name"

[payload_schema.properties.task]
type = "string"
description = "Sub-task prompt for the target agent"

[payload_schema.properties.priority]
type = "integer"
default = 5
minimum = 0
maximum = 255
description = "Delegated task priority"

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 16
max_cpu_ms    = 1000
syscalls      = []
