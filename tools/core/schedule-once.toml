tags = ["meta", "write"]

[manifest]
name        = "schedule-once"
version     = "1.1.0"
description = "Schedule a one-shot action at an absolute datetime or relative delay. Supports three modes: 'task' (run an LLM prompt), 'notify' (deliver a user notification directly), or 'tool' (invoke a single tool with fixed args). Use fire_at (ISO 8601) for a specific moment, or delay_secs for a relative offset."
author      = "agentos-core"
trust_tier  = "core"
group       = "scheduling"
risk_class  = "write_scoped"

[capabilities_required]
permissions = ["schedule.job:w"]

[capabilities_provided]
outputs = ["job_id", "job_name", "fires_at"]

[intent_schema]
input  = "ScheduleOnceIntent"
output = "ScheduleOnceResult"

[payload_schema]
type = "object"

[payload_schema.properties.name]
type        = "string"
description = "Optional unique name for this once-job (used to cancel or identify it). When omitted, the kernel auto-generates 'auto-<mode>-<8hex>'."

[payload_schema.properties.mode]
type        = "string"
enum        = ["task", "notify", "tool"]
description = "Action to take when the job fires. 'task' runs an LLM prompt (default), 'notify' delivers a user notification without involving the LLM, 'tool' invokes a single tool directly."
default     = "task"

[payload_schema.properties.task_prompt]
type        = "string"
description = "Task prompt to run on the agent when the job fires (required when mode='task')"

[payload_schema.properties.notify_subject]
type        = "string"
description = "Notification subject line (required when mode='notify')"

[payload_schema.properties.notify_body]
type        = "string"
description = "Notification body text (required when mode='notify')"

[payload_schema.properties.notify_priority]
type        = "string"
enum        = ["info", "warning", "urgent", "critical"]
description = "Notification priority level (optional when mode='notify', default 'info')"
default     = "info"

[payload_schema.properties.tool]
type        = "string"
description = "Name of the tool to invoke when the job fires (required when mode='tool')"

[payload_schema.properties.tool_args]
type        = "object"
description = "Fixed argument payload passed to the tool (optional when mode='tool')"

[payload_schema.properties.agent_name]
type        = "string"
description = "Name of the agent that will run the task. Defaults to the calling agent."

[payload_schema.properties.fire_at]
type        = "string"
description = "Absolute fire time as ISO 8601 / RFC 3339 (e.g. '2026-04-19T15:00:00Z'). Mutually exclusive with delay_secs."

[payload_schema.properties.delay_secs]
type        = "integer"
description = "Relative delay in seconds from now (1–86400). Mutually exclusive with fire_at."
minimum     = 1
maximum     = 86400

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 4
max_cpu_ms    = 100
syscalls      = []
