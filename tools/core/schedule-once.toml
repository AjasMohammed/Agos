[manifest]
name        = "schedule-once"
version     = "1.0.0"
description = "Schedule a one-shot task at an absolute datetime or relative delay. Use fire_at (ISO 8601) for a specific moment, or delay_secs for a relative offset."
author      = "agentos-core"
trust_tier  = "core"
group       = "scheduling"
risk_class  = "write_scoped"

[capabilities_required]
permissions = ["schedule.job:w"]

[capabilities_provided]
outputs = ["job_id", "job_name", "fires_at"]

[intent_schema]
input  = "ScheduleOnceIntent"
output = "ScheduleOnceResult"

[input_schema]
type = "object"
required = ["name", "task_prompt"]

[input_schema.properties.name]
type        = "string"
description = "Unique name for this once-job (used to cancel or identify it)"

[input_schema.properties.task_prompt]
type        = "string"
description = "Task prompt to run on the agent when the job fires"

[input_schema.properties.agent_name]
type        = "string"
description = "Name of the agent that will run the task. Defaults to the calling agent."

[input_schema.properties.fire_at]
type        = "string"
description = "Absolute fire time as ISO 8601 / RFC 3339 (e.g. '2026-04-19T15:00:00Z'). Mutually exclusive with delay_secs."

[input_schema.properties.delay_secs]
type        = "integer"
description = "Relative delay in seconds from now (1–86400). Mutually exclusive with fire_at."
minimum     = 1
maximum     = 86400

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 4
max_cpu_ms    = 100
syscalls      = []
