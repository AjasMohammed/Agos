tags = ["read"]
risk_class = "readonly_scoped"

[manifest]
name        = "hardware-info"
version     = "1.0.0"
description = "Return hardware capabilities: CPU, memory, GPU, disk capacity, and battery charge/charging state via the Hardware Abstraction Layer."
author      = "agentos-core"
trust_tier  = "core"
category    = "system"
search_hints = ["what hardware is this", "cpu and memory specs", "system info", "battery percentage", "battery level", "is it charging", "power state"]

[capabilities_required]
permissions = ["hardware.system:r"]

[capabilities_provided]
outputs = ["content.structured"]

[intent_schema]
input  = "HardwareInfoQuery"
output = "HardwareInfoResult"

[payload_schema]
type = "object"
description = "No input required"

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 64
max_cpu_ms    = 5000
syscalls      = []
