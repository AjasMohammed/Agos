[manifest]
name = "hardware-set-desired"
version = "1.0.0"
description = "Set the desired state for an IoT device (subject to operator-defined safety rules). The safety engine evaluates all applicable rules before the command is dispatched."
author = "agentos-core"
trust_tier = "core"
tags = ["iot", "hardware", "safety"]

[capabilities_required]
permissions = ["hardware.iot:w"]

[capabilities_provided]
outputs = ["device_id", "desired_state", "reconciled"]

[intent_schema]
input = "HardwareSetDesiredIntent"
output = "HardwareSetDesiredResult"

[sandbox]
network = false
fs_write = false
max_memory_mb = 32
max_cpu_ms = 5000
