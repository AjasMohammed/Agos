tags = ["write", "exec"]

[manifest]
name = "container-create"
version = "1.0.0"
description = "Create an isolated container for running scripts or workloads. Specify a Docker image, memory, CPU, and network mode. Returns a container_id for use with container-exec."
author = "agentos-core"
trust_tier = "core"
risk_class = "exec_capable"
tags = ["compute", "sandbox", "container"]

[capabilities_required]
permissions = ["container.create:x"]

[capabilities_provided]
outputs = ["container_id", "image", "expires_at"]

[intent_schema]
input = "ContainerCreateIntent"
output = "ContainerCreateResult"

[payload_schema]
type     = "object"
required = ["image"]

[payload_schema.properties.image]
type        = "string"
description = "Docker image reference (e.g. 'python:3.12-slim')."

[payload_schema.properties.memory_mb]
type        = "integer"
minimum     = 16
default     = 256
description = "Memory limit in MiB."

[payload_schema.properties.cpu]
type        = "number"
minimum     = 0.1
default     = 1.0
description = "CPU cores (fractional allowed)."

[payload_schema.properties.network]
type        = "string"
enum        = ["none", "bridge", "host"]
default     = "none"
description = "Network mode."

[payload_schema.properties.ttl_seconds]
type        = "integer"
minimum     = 1
default     = 3600
description = "Lifetime in seconds before the container is auto-destroyed."

[sandbox]
network = false
fs_write = false
max_memory_mb = 32
max_cpu_ms = 30000
