tags = ["exec"]

[manifest]
name = "proc-spawn"
version = "1.0.0"
description = "Spawn a managed background process with resource limits and output capture. Pass `workspace` to resolve the binary inside a managed environment (venv/bin → node_modules/.bin → bin) with VIRTUAL_ENV activated."
author = "agentos-core"
trust_tier = "core"
risk_class = "exec_capable"

[capabilities_required]
permissions = ["proc.spawn:x"]

[capabilities_provided]
outputs = ["content.json"]

[intent_schema]
input = "ProcSpawnIntent"
output = "ProcSpawnResult"

[payload_schema]
required = ["binary"]
type = "object"

[payload_schema.properties.binary]
description = "Binary name to execute. Without `workspace`, must be a bare name (no slashes) on the allowed list. With `workspace`, resolved from {ws}/venv/bin, {ws}/node_modules/.bin, {ws}/bin before falling back to PATH; the workspace acts as the sandbox so the global allowlist is bypassed for workspace-resolved binaries."
type = "string"

[payload_schema.properties.args]
description = "Command line arguments"
type = "array"
items = { type = "string" }

[payload_schema.properties.working_dir]
description = "Working directory (default: workspace root when `workspace` is set, otherwise agent data_dir)"
type = "string"

[payload_schema.properties.workspace]
description = "Optional managed workspace name (created via env-create). Activates VIRTUAL_ENV and the workspace-local bin paths so long-running processes like uvicorn, jest, or cargo-installed CLIs work."
type = "string"

[sandbox]
network = false
fs_write = true
gpu = false
max_memory_mb = 256
max_cpu_ms = 30000
syscalls = []

[executor]
type = "inline"
