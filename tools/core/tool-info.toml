[manifest]
name        = "tool-info"
version     = "1.0.0"
description = "Get the full schema and usage details for a specific tool by name."
author      = "agentos-core"
trust_tier  = "core"
risk_class  = "readonly_scoped"

[capabilities_required]
permissions = []

[capabilities_provided]
outputs = ["content.structured"]

[intent_schema]
input  = "ToolInfoQuery"
output = "ToolInfo"

[input_schema]
type = "object"
required = ["tool_name"]

[input_schema.properties.tool_name]
type = "string"
description = "Tool name from the agent-manual index, for example 'memory-write'."

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 16
max_cpu_ms    = 1000
syscalls      = []
