tags = ["meta", "read"]

[manifest]
name        = "agent-manual"
version     = "1.0.0"
description = "Query structured AgentOS documentation: tools, permissions, memory, events, commands, errors. Use {\"section\": \"index\"} to see all sections."
author      = "agentos-core"
trust_tier  = "core"

[capabilities_required]
permissions = []

[capabilities_provided]
outputs = ["content.structured"]

[intent_schema]
input  = "ManualQuery"
output = "ManualSection"

[payload_schema]
type = "object"
required = ["section"]

[payload_schema.properties.section]
type = "string"
enum = ["index", "tools", "tool-detail", "permissions", "memory", "events", "commands", "errors", "feedback", "agents", "tasks", "procedural", "escalation", "coordination", "suggest", "scratchpad", "channels", "mcp", "hal", "plugins", "skills", "notifications", "containers", "webhooks", "capabilities", "scheduling", "channel-telegram"]
description = "Manual section to return"

[payload_schema.properties.name]
type = "string"
description = "Tool name required when section is tool-detail"

[payload_schema.properties.skill]
type = "string"
description = "Skill name for drill-down. Pass with section=\"skills\" to see one skill's required tools, permissions, triggers, and budget."

[payload_schema.properties.server]
type = "string"
description = "MCP server name for drill-down. Pass with section=\"mcp\" to see that server's tools."

[payload_schema.properties.query]
type = "string"
description = "Free-text query for section=\"suggest\" — ranks tools by keyword/semantic match."

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 16
max_cpu_ms    = 1000
syscalls      = []
