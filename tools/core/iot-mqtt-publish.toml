tags = ["write", "network"]

[manifest]
name = "iot-mqtt-publish"
version = "1.0.0"
risk_class  = "write_scoped"
description = "Publish a message to an MQTT topic for IoT actuator control."
author = "agentos-core"
trust_tier = "core"
tags = ["iot", "mqtt", "hardware"]

[capabilities_required]
permissions = ["hardware.mqtt:w"]

[capabilities_provided]
outputs = ["published"]

[intent_schema]
input = "IotMqttPublishIntent"
output = "IotMqttPublishResult"

[payload_schema]
type     = "object"
required = ["topic", "payload"]

[payload_schema.properties.topic]
type        = "string"
description = "MQTT topic to publish to (e.g. 'home/livingroom/lamp/set')."

[payload_schema.properties.payload]
type        = "string"
description = "Message payload as a UTF-8 string. Use JSON for structured data."

[payload_schema.properties.qos]
type        = "integer"
enum        = [0, 1, 2]
default     = 0
description = "MQTT quality-of-service level."

[payload_schema.properties.retain]
type        = "boolean"
default     = false
description = "Whether the broker should retain this message as the topic's last known value."

[sandbox]
network = false
fs_write = false
max_memory_mb = 32
max_cpu_ms = 5000
