tags = ["meta", "read"]

[manifest]
name        = "display-config"
version     = "1.0.0"
description = "Inspect and modify display topology (mode, position, scale, enable/disable) via the HAL display driver."
author      = "agentos-core"
trust_tier  = "core"

[capabilities_required]
permissions = [
  "hardware.display:r",
  "hardware.display:q",
  "hardware.display.config:w",
]

[capabilities_provided]
outputs = ["hardware.display", "content.structured"]

[intent_schema]
input  = "DisplayConfigIntent"
output = "DisplayConfigResult"

[payload_schema]
type = "object"
description = "Display configuration request"

[payload_schema.properties.action]
type = "string"
enum = ["list", "test", "set_mode", "set_position", "set_scale", "enable", "disable", "confirm", "revert"]
default = "list"
description = "Display action to execute."

[payload_schema.properties.output]
type = "string"
description = "Display output id (for example HDMI-A-1)."

[payload_schema.properties.width]
type = "integer"
minimum = 1
maximum = 16384
description = "Target width for set_mode."

[payload_schema.properties.height]
type = "integer"
minimum = 1
maximum = 16384
description = "Target height for set_mode."

[payload_schema.properties.refresh_hz]
type = "number"
minimum = 1
maximum = 1000
description = "Optional target refresh rate for set_mode."

[payload_schema.properties.x]
type = "integer"
minimum = -32768
maximum = 32768
description = "X coordinate for set_position."

[payload_schema.properties.y]
type = "integer"
minimum = -32768
maximum = 32768
description = "Y coordinate for set_position."

[payload_schema.properties.scale]
type = "number"
minimum = 0.25
maximum = 4
description = "Scale factor for set_scale."

[payload_schema.properties.auto_revert_timeout_secs]
type = "integer"
minimum = 5
maximum = 300
description = "Auto-revert confirmation timeout in seconds."

[payload_schema.properties.config_id]
type = "string"
description = "Pending display configuration id for confirm/revert actions."

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 256
max_cpu_ms    = 20000
syscalls      = []

[[examples]]
description = "List outputs"
payload = { action = "list" }

[[examples]]
description = "Set mode"
payload = { action = "set_mode", output = "HDMI-A-1", width = 1920, height = 1080, refresh_hz = 60 }

[[examples]]
description = "Disable output"
payload = { action = "disable", output = "DP-1" }
