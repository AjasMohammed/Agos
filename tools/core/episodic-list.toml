tags = ["read"]
risk_class = "readonly_scoped"

[manifest]
name        = "episodic-list"
version     = "1.0.0"
description = "List recent episodic memory entries for the current task in chronological order"
author      = "agentos-core"
trust_tier  = "core"
search_hints = ["what happened recently", "list past episodes", "recent task history"]

[capabilities_required]
permissions = []

[capabilities_provided]
outputs = ["content.text"]

[intent_schema]
input  = "EpisodicListIntent"
output = "EpisodicListResult"

[payload_schema]
type = "object"

[payload_schema.properties.limit]
type = "integer"
default = 20
minimum = 1
maximum = 200
description = "Maximum entries to return"


[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 64
max_cpu_ms    = 2000
syscalls      = []
