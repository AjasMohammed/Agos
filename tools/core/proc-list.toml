tags = ["read", "meta"]

[manifest]
name = "proc-list"
version = "1.0.0"
description = "List all managed processes for this agent"
author = "agentos-core"
trust_tier = "core"
risk_class = "readonly_scoped"

[capabilities_required]
permissions = ["proc.list:r"]

[capabilities_provided]
outputs = ["content.json"]

[intent_schema]
input = "ProcListIntent"
output = "ProcListResult"

[payload_schema]
type = "object"

[sandbox]
network = false
fs_write = false
gpu = false
max_memory_mb = 64
max_cpu_ms = 5000
syscalls = []

[executor]
type = "inline"
