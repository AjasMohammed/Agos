tags = ["meta", "read"]

[manifest]
name        = "system-services"
version     = "1.0.0"
risk_class  = "readonly_external"
description = "List and inspect systemd services/units and their logs via D-Bus and journalctl on the host."
author      = "agentos-core"
trust_tier  = "core"

[manifest.usage_hints]
use_for = ["Checking status of systemd services", "Listing failed units", "Reading service-specific logs"]
prefer_over = ["shell-exec systemctl", "shell-exec journalctl"]
quick_example = { action = "status", name = "nginx.service" }

[capabilities_required]
permissions = ["system.services:r"]

[capabilities_provided]
outputs = ["content.structured"]

[intent_schema]
input  = "SystemServicesIntent"
output = "SystemServicesResult"

[payload_schema]
type = "object"
required = ["action"]

[payload_schema.properties.action]
type = "string"
enum = ["list", "status", "logs"]
description = "Action to perform"

[payload_schema.properties.name]
type = "string"
description = "Unit name (required for 'status' and 'logs', e.g. 'nginx.service')"

[payload_schema.properties.state_filter]
type = "string"
enum = ["active", "failed", "inactive", "all"]
default = "all"
description = "Filter units by active state (for 'list')"

[payload_schema.properties.limit]
type = "integer"
minimum = 1
maximum = 500
default = 100
description = "Max number of units to return (for 'list')"

[payload_schema.properties.log_lines]
type = "integer"
minimum = 1
maximum = 500
default = 50
description = "Number of log lines to tail (for 'logs')"

[sandbox]
network       = false
fs_write      = false
gpu           = false
max_memory_mb = 32
max_cpu_ms    = 5000
syscalls      = []
