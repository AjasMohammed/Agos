tags = ["write"]

[manifest]
name = "storage-zone-create"
version = "1.0.0"
description = "Request access to a filesystem directory as a managed storage zone"
author = "agentos-core"
trust_tier = "core"
risk_class = "write_scoped"

[capabilities_required]
permissions = [
    "storage.zone.create:x",
]

[capabilities_provided]
outputs = ["content.json"]

[intent_schema]
input = "StorageZoneCreateIntent"
output = "StorageZoneCreateResult"

[payload_schema]
required = ["path"]
type = "object"

[payload_schema.properties.path]
description = "Absolute path to the directory to grant access to"
type = "string"

[payload_schema.properties.access]
description = "Access level: 'ro' (read-only) or 'rw' (read-write, default)"
type = "string"
default = "rw"

[sandbox]
network = false
fs_write = true
gpu = false
max_memory_mb = 64
max_cpu_ms = 5000
syscalls = []

[executor]
type = "inline"
