services:
  agentos:
    image: ghcr.io/ajasmohammed/agos:latest
    build:
      context: .
    container_name: agentos-kernel
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/log/agentos:uid=65532,gid=65532,mode=0755
    # Hardened defaults: no-new-privileges + read_only root FS combined with
    # Docker's default seccomp profile and capability set. NOTE: bwrap-based
    # script/shell-exec tools require user namespaces and additional syscalls,
    # so they fail with EPERM under this profile. To enable script tools you must
    # opt in to a relaxation (e.g. `security_opt: [seccomp=unconfined]` and drop
    # `no-new-privileges:true`), which weakens isolation — see deploy/agentos.service
    # for the equivalent systemd hardening tradeoff. Do not relax for the web stack
    # unless script execution is explicitly required.
    security_opt:
      - no-new-privileges:true
    environment:
      - AGENTOS_CONFIG=/etc/agentos/config.toml
      - AGENTOS_DATA_DIR=/var/lib/agentos/data
      - AGENTOS_AUTO_INIT_VAULT=true
      - AGENTOS_VAULT_PASSPHRASE=${AGENTOS_VAULT_PASSPHRASE:-}
      - AGENTOS_OLLAMA_HOST=${AGENTOS_OLLAMA_HOST:-}
      - AGENTOS_LLM_URL=${AGENTOS_LLM_URL:-}
      - AGENTOS_OPENAI_BASE_URL=${AGENTOS_OPENAI_BASE_URL:-}
      - AGENTOS_OTEL_ENABLED=${AGENTOS_OTEL_ENABLED:-true}
      - AGENTOS_OTEL_ENDPOINT=${AGENTOS_OTEL_ENDPOINT:-http://jaeger:4317}
      - RUST_LOG=${RUST_LOG:-agentos=info}
    volumes:
      - agentos-data:/var/lib/agentos/data
      - agentos-user-tools:/var/lib/agentos/tools/user
      - ./config/docker.toml:/etc/agentos/config.toml:ro
      # Container runtime tools (container-create / container-exec / container-logs).
      # Mounting the host Docker socket gives this container effective root on the
      # host — keep commented out unless container tooling is required. Uncomment
      # ONLY if the container-runtime tools are needed (this grants host root).
      # - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
      # Health/metrics: bind to loopback on the host so /metrics and /healthz
      # (operational internals, unauthenticated) are not reachable from other
      # hosts. Scrape locally or front with a trusted proxy.
      - "127.0.0.1:9091:9091"
    restart: unless-stopped
    depends_on:
      jaeger:
        condition: service_started
      ollama:
        condition: service_started
    command: ["web", "serve", "--host", "0.0.0.0", "--port", "8080"]

  jaeger:
    image: jaegertracing/jaeger:2.4.0
    container_name: agentos-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"

  ollama:
    image: ollama/ollama:latest
    container_name: agentos-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

volumes:
  agentos-data:
  agentos-user-tools:
  ollama-models:
