name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: OpenAPI spec is in sync with handlers
        run: |
          set -euo pipefail
          cargo run -p agentos-api --bin gen-openapi -- /tmp/openapi.json
          if ! diff -u crates/agentos-api/openapi.json /tmp/openapi.json; then
            echo "::error::openapi.json is stale. Regenerate it with:"
            echo "  cargo run -p agentos-api --bin gen-openapi -- crates/agentos-api/openapi.json"
            exit 1
          fi
          echo "OpenAPI spec in sync with handlers ✓"

      - name: Lint OpenAPI contract (Spectral)
        run: npx --yes @stoplight/spectral-cli@6 lint crates/agentos-api/openapi.json --ruleset .spectral.yaml --fail-severity error

      - name: No silent .ok() swallows in the task-executor hot path
        run: |
          set -euo pipefail
          # The 27 silent error swallows in task_executor.rs were removed; keep
          # them out. Best-effort metric sinks (counter/gauge/histogram .ok())
          # are legitimately allowed. (run_loop.rs has one allowed best-effort
          # audit write at the proposal-expiry sweep — not in scope here.)
          hits=$(grep -rn '\.ok();' \
                   crates/agentos-kernel/src/task_executor.rs \
                 | grep -vE 'metrics|counter|gauge|histogram' || true)
          if [ -n "$hits" ]; then
            echo "Silent .ok() error swallow reintroduced in task_executor.rs:"
            echo "$hits"
            exit 1
          fi
          echo "No silent .ok() swallows in task_executor.rs ✓"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        # All four ignored advisories hit the same path: rumqttc 0.25.1 transitively
        # pins rustls-webpki 0.102.8, which is unfixable until rumqttc 0.26+ ships
        # (still not released as of 2026-05-10). The mqtt feature is opt-in and the
        # affected code paths (CRL revocation, name constraints) are not exercised
        # by AgentOS MQTT broker connections. See audit.toml for full rationale.
        run: cargo audit
          --ignore RUSTSEC-2026-0049
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0104

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo-deny (advisories, bans, licenses, sources)
        # Supply-chain policy in deny.toml. Advisory ignores are kept in lockstep
        # with audit.toml / the cargo-audit step above.
        run: cargo deny check
