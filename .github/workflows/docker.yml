name: Docker Image

on:
  # Tagged releases (v*) are built+pushed by the canonical docker job in
  # release.yml — this workflow only builds the rolling :latest image from main
  # to avoid double-publishing the same image on a v* tag.
  push:
    branches:
      - main

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ajasmohammed/agos:latest
            ghcr.io/ajasmohammed/agos:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
