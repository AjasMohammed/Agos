name: Release Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --locked --workspace -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Security regression suite (CVE-class tests)
        run: |
          bash scripts/check-toolpre-guard.sh
          cargo test --locked -p agentos-kernel --test security_acceptance_test --test security_ssrf_metadata_blocked \
            --test security_injected_config_write_requires_approval --test security_file_tools_reject_traversal
          cargo test --locked -p agentos-api --test service_tests security_

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Validate single-instance Helm deployment
        run: |
          helm lint deploy/helm/agentos --set vault.existingSecret=test-vault
          helm template agentos deploy/helm/agentos --set vault.existingSecret=test-vault >/tmp/agentos-chart.yaml
          if helm template agentos deploy/helm/agentos --set vault.existingSecret=test-vault --set replicaCount=2; then
            echo "Chart accepted multiple writers"
            exit 1
          fi

      - name: Build release binaries
        run: cargo build --locked --workspace --release

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Supply-chain policy (cargo-deny)
        # Blocks the release path on advisory/license/source/ban violations.
        # Policy: deny.toml. Advisory ignores lockstep with audit.toml.
        run: cargo deny check
