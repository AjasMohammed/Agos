name: Release
on:
  push:
    tags: ['v*']

jobs:
  quality:
    name: Quality gate (fmt / clippy / deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fail fast if the pushed tag disagrees with the workspace version, so the
      # Release name and `agentos --version` can never drift apart.
      - name: Verify tag matches workspace version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          V="$(grep -m1 -E '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$V" != "$TAG" ]; then
            echo "::error file=Cargo.toml::workspace version ${V} != tag ${TAG} — bump [workspace.package] version or re-tag."
            exit 1
          fi
          echo "Workspace version ${V} matches tag v${TAG}."
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  build:
    needs: quality
    strategy:
      # One broken leg must not cancel the others — linux-amd64 is the only
      # required artifact; the rest are best-effort (see continue-on-error below).
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: agentos-linux-amd64
            use_cross: false
            # Peripheral drivers (all but bluetooth); registered at runtime
            # only when the host has the hardware.
            cargo_args: --features release-peripherals
          # Lite: no ONNX/MiniLM vector search (FTS5 lexical only). Same
          # kernel, same security model, ~1/3 the binary and idle RSS.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: agentos-lite-linux-amd64
            use_cross: false
            cargo_args: --no-default-features
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: agentos-linux-arm64
            use_cross: true            # cross supplies the aarch64 gnu toolchain + ort aarch64 linux-gnu libs
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: agentos-darwin-amd64
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: agentos-darwin-arm64
            use_cross: false
    runs-on: ${{ matrix.os }}
    # Linux x86_64 is the primary target (and what install.sh serves most users);
    # only that leg is allowed to block the release. arm64 cross builds have a
    # history of breaking on ort/onnxruntime, and a red darwin leg should not
    # strand linux users without a release either.
    continue-on-error: ${{ matrix.artifact != 'agentos-linux-amd64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build (native)
        if: matrix.use_cross == false
        run: cargo build --profile dist --target ${{ matrix.target }} -p agentos-cli ${{ matrix.cargo_args }}
      - name: Build (cross)
        if: matrix.use_cross == true
        run: cross build --profile dist --target ${{ matrix.target }} -p agentos-cli ${{ matrix.cargo_args }}
      - name: Package + checksum
        run: |
          cp target/${{ matrix.target }}/dist/agentos ${{ matrix.artifact }}
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          fi
      - name: Shared-library gate
        # A .so the host lacks makes the binary fail at exec, before any
        # runtime hardware probe can run. Only the libc set is allowed.
        if: runner.os == 'Linux' && matrix.use_cross == false
        run: |
          extra=$(ldd ${{ matrix.artifact }} | awk '{print $1}' \
            | grep -v -E '^(linux-vdso\.so\.1|libc\.so\.6|libm\.so\.6|libgcc_s\.so\.1|libstdc\+\+\.so\.6|libdl\.so\.2|libpthread\.so\.0|librt\.so\.1|/lib64/ld-linux-x86-64\.so\.2)$' || true)
          if [ -n "$extra" ]; then
            echo "::error::release binary links unexpected shared libraries:"
            echo "$extra"
            exit 1
          fi
      - name: Install minisign
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew install minisign
          else
            # minisign is not packaged for Ubuntu 22.04 (jammy) — `apt-get
            # install minisign` fails with "Unable to locate package". Use the
            # upstream static binary, pinned by checksum because this is the
            # tool that signs the release.
            curl --proto '=https' --tlsv1.2 -fsSL \
              https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz \
              -o /tmp/minisign.tar.gz
            echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  /tmp/minisign.tar.gz" \
              | sha256sum -c -
            tar -xzf /tmp/minisign.tar.gz -C /tmp
            sudo install -m 0755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          fi
          minisign -v
      - name: Sign artifact (minisign)
        # Passwordless CI key (see packaging/signing/README.md). The installer
        # refuses to install without a .sig, so an unsigned release is a broken
        # release: fail the leg instead of shipping checksum-only.
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -n "$MINISIGN_KEY" ]; then
            printf '%s\n' "$MINISIGN_KEY" > /tmp/minisign.key
            minisign -S -s /tmp/minisign.key -m ${{ matrix.artifact }} -x ${{ matrix.artifact }}.sig
            rm -f /tmp/minisign.key
            echo "Signed ${{ matrix.artifact }}"
          else
            echo "::error::MINISIGN_SECRET_KEY not set — refusing to publish an unsigned artifact."
            exit 1
          fi
      - name: Generate CycloneDX SBOM (linux-amd64 leg only)
        if: matrix.artifact == 'agentos-linux-amd64'
        # SBOM is a nice-to-have; it must not block the only required build leg.
        continue-on-error: true
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json
          # cargo-cyclonedx emits per-package bom files; gather the workspace
          # root bom into a single bom.json shipped with every release.
          if [ -f bom.json ]; then
            :
          else
            root_bom=$(find . -name 'bom.json' -not -path './target/*' | head -n1)
            cp "$root_bom" bom.json
          fi
      - name: Upload SBOM (linux-amd64 leg only)
        if: matrix.artifact == 'agentos-linux-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          if-no-files-found: warn # SBOM generation is best-effort (see above)
          path: bom.json
      - name: Upload binary + checksum (required)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
      - name: Upload signature
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-sig
          if-no-files-found: error
          path: ${{ matrix.artifact }}.sig

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          # amd64 only: a multi-platform push is all-or-nothing, and an arm64
          # leg would compile the whole workspace under QEMU (hours) and take the
          # amd64 image down with it if it failed. Re-add arm64 with a native runner.
          platforms: linux/amd64
          # Pre-release tags (v1.0.0-rc.1) must not move :latest. Empty lines are dropped.
          tags: |
            ghcr.io/ajasmohammed/agos:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && 'ghcr.io/ajasmohammed/agos:latest' || '' }}

  release:
    needs: [build, docker]
    # Publish the Release as long as the required build leg succeeded — a failed
    # docker push (ghcr outage, permissions) must not strand the binaries.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Tags with a pre-release suffix (v1.0.0-rc.1) publish as GitHub
          # pre-releases so `latest` and the installer's default stay on finals.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Optional legs (arm64/darwin/sig/sbom) may have produced nothing;
          # unmatched globs are warned about, not fatal (fail_on_unmatched_files
          # defaults to false).
          files: |
            agentos-linux-amd64/*
            agentos-lite-linux-amd64/*
            agentos-linux-arm64/*
            agentos-darwin-amd64/*
            agentos-darwin-arm64/*
            agentos-linux-amd64-sig/*
            agentos-lite-linux-amd64-sig/*
            agentos-linux-arm64-sig/*
            agentos-darwin-amd64-sig/*
            agentos-darwin-arm64-sig/*
            sbom/bom.json
