name: Bug Report
description: Report a bug in AgentOS
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `agentos start`
        2. Execute `agentos agent connect --provider ollama`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include any error messages or logs.
  - type: input
    id: version
    attributes:
      label: AgentOS Version
      placeholder: "0.1.0 or commit hash"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (x86_64)
        - Linux (arm64)
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Other
    validations:
      required: true
