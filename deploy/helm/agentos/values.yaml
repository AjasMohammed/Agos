image:
  repository: ghcr.io/ajasmohammed/agos
  # Empty falls back to the chart's appVersion (pins to a specific release
  # instead of the mutable "latest" tag). Override only to deploy a different tag.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8080
  healthPort: 9091

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

vault:
  existingSecret: ""
  passphrase: ""

config:
  autoInitVault: true
  healthPort: 9091
  # Bind the health/metrics server to all interfaces inside the pod so the
  # kubelet's httpGet probes (which connect to the pod IP, not loopback) can
  # reach it. The pod network namespace is isolated, so this is not exposed
  # beyond the pod unless a Service/Ingress is created for it.
  healthBind: "0.0.0.0"
  ollamaHost: http://ollama:11434
  ollamaModel: kimi-k2.5:cloud
  llmUrl: ""
  openaiBaseUrl: https://api.openai.com/v1
  anthropicBaseUrl: https://api.anthropic.com/v1
  geminiBaseUrl: https://generativelanguage.googleapis.com/v1beta
  otelEnabled: false
  otelEndpoint: ""
  otelServiceName: agentos
  logLevel: agentos=info

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

podSecurityContext:
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: agentos.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
