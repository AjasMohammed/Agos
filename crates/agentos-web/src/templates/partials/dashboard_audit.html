{% for entry in recent_audit %}
<div class="activity-item">
    <span class="activity-dot activity-dot-{% if entry.severity == 'Error' %}error{% elif entry.severity == 'Warn' %}warning{% elif entry.severity == 'Security' %}security{% else %}info{% endif %}" aria-hidden="true"></span>
    <div class="activity-content">
        <div class="activity-event">
            <span class="activity-event-type">{{ entry.event_type }}</span>
            {% if entry.agent_id %}
            <span class="activity-agent">&#183; <code class="id-short" title="{{ entry.agent_id }}">{{ entry.agent_id[:8] }}</code></span>
            {% endif %}
        </div>
    </div>
    <span class="activity-ts">{{ entry.timestamp }}</span>
</div>
{% else %}
<div class="inline-empty-state">
    <p><strong>No recent activity</strong></p>
    <p>Kernel and agent events will stream here in real time.</p>
</div>
{% endfor %}
