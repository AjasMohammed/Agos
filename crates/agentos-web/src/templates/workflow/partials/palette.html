{% for group in palette %}
<details class="wb-palette-group" open>
  <summary>{{ group.display_name }}</summary>
  <ul>
    {% for node in group.nodes %}
    <li class="wb-palette-item"
        data-label="{{ node.node.display_name | lower }}"
        draggable="true"
        ondragstart="event.dataTransfer.setData('node_type','{{ node.node.id }}'); event.dataTransfer.setData('node_label','{{ node.node.display_name }}')">
      <span class="wb-palette-icon"
            style="background:{{ node.node.color | default(value='#4a90e2') }}">
        {% if node.node.icon %}
        <img src="{{ node.node.icon }}" alt="">
        {% else %}
        <span style="color:#fff;font-size:0.7rem;font-weight:700">{{ node.node.display_name | truncate(length=2, end='') | upper }}</span>
        {% endif %}
      </span>
      <span class="wb-palette-label">{{ node.node.display_name }}</span>
    </li>
    {% endfor %}
  </ul>
</details>
{% endfor %}
