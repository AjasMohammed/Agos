[package]
name = "agentos-memory"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agentos-types = { path = "../agentos-types" }
# Pinned to 4.x — upgrading to 5.x requires API migration and platform testing
# (5.x uses @pykeio/ort ONNX runtime which may increase binary size)
# rustls rather than fastembed's default native-tls: hf-hub was the only
# native-tls consumer in the tree, and openssl-sys has no aarch64 libs in the
# cross image, which broke the linux-arm64 release leg.
fastembed = { version = "4", optional = true, default-features = false, features = [
    "ort-download-binaries",
    "hf-hub-rustls-tls",
] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[features]
# Off by default at this leaf on purpose: `agentos-cli` enables it in its own
# `default`, so `cargo build -p agentos-cli --no-default-features` is the lite
# build without `default-features = false` on every edge in the graph.
default = []
# ONNX Runtime + MiniLM vector embeddings (~100 MB of binary, ~200 MB idle RSS).
# Off: `Embedder::new`/`with_cache_dir` return Err, the kernel falls back to
# the zero-vector embedder and every store degrades to FTS5 lexical search.
embeddings = ["dep:fastembed"]

[dev-dependencies]
tempfile = { workspace = true }
