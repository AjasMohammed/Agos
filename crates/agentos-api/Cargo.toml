[package]
name = "agentos-api"
version = "0.1.0"
edition = "2021"

[dependencies]
agentos-types = { path = "../agentos-types" }
agentos-kernel = { path = "../agentos-kernel" }
agentos-audit = { path = "../agentos-audit" }
agentos-vault = { path = "../agentos-vault" }
agentos-pipeline = { path = "../agentos-pipeline" }
agentos-llm = { path = "../agentos-llm" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true, features = ["macros", "ws"] }
agentos-bus = { path = "../agentos-bus" }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tower_governor = "0.8"
hmac = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
subtle = "2"
zeroize = { workspace = true }
rusqlite = { workspace = true }
futures = "0.3"
bytes = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
serial_test = "3.4.0"
toml = { workspace = true }
agentos-kernel = { path = "../agentos-kernel" }
agentos-vault = { path = "../agentos-vault" }
agentos-types = { path = "../agentos-types" }
