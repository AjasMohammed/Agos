[package]
name = "agentos-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "agentos"
path = "src/main.rs"

[dependencies]
agentos-types = { path = "../agentos-types" }
agentos-kernel = { path = "../agentos-kernel" }
agentos-sandbox = { path = "../agentos-sandbox" }
agentos-bus = { path = "../agentos-bus" }
agentos-hal = { path = "../agentos-hal" }
agentos-vault = { path = "../agentos-vault" }
agentos-tools = { path = "../agentos-tools" }
agentos-mcp = { path = "../agentos-mcp" }
agentos-api = { path = "../agentos-api" }
agentos-web = { path = "../agentos-web" }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
rust-embed = { version = "8", features = ["compression"] }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
rpassword = { workspace = true }
reqwest = { workspace = true }
dialoguer = { workspace = true }
indicatif = { workspace = true }
toml_edit = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
subtle = "2"
zeroize = { workspace = true }

[features]
# `embeddings` is the ONNX/MiniLM vector-search runtime (~100 MB of binary).
# Lite build: `cargo build -p agentos-cli --no-default-features` → FTS5-only.
default = ["embeddings"]
embeddings = ["agentos-kernel/embeddings", "agentos-api/embeddings", "agentos-tools/embeddings"]
otel = ["agentos-kernel/otel"]
# Peripheral passthroughs: the HAL drivers are feature-gated in agentos-kernel,
# and the registry drops their manifests unless the matching feature is on.
bluetooth = ["agentos-kernel/bluetooth"]
wifi = ["agentos-kernel/wifi"]
all-peripherals = ["agentos-kernel/all-peripherals"]

[dev-dependencies]
tempfile = { workspace = true }
agentos-audit = { path = "../agentos-audit" }
agentos-capability = { path = "../agentos-capability" }
agentos-llm = { path = "../agentos-llm" }
toml = { workspace = true }
serial_test = "3.4.0"
