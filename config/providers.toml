# AgentOS Provider Catalog
# OpenAI-compatible LLM providers that can be used via the `CustomCore` adapter.
# Each entry defines a provider's base URL, API key env var, and available models.
# Use `agentos provider list` to see all available providers and their status.

[[provider]]
name = "deepseek"
display_name = "DeepSeek"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
compatible_with = "openai"
default_model = "deepseek-chat"
models = ["deepseek-chat", "deepseek-coder", "deepseek-reasoner"]

[[provider]]
name = "groq"
display_name = "Groq"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
compatible_with = "openai"
default_model = "llama-3.3-70b-versatile"
models = ["llama-3.3-70b-versatile", "mixtral-8x7b-32768", "gemma2-9b-it"]

[[provider]]
name = "fireworks"
display_name = "Fireworks AI"
base_url = "https://api.fireworks.ai/inference/v1"
api_key_env = "FIREWORKS_API_KEY"
compatible_with = "openai"
default_model = "accounts/fireworks/models/llama-v3p3-70b-instruct"
models = ["accounts/fireworks/models/llama-v3p3-70b-instruct"]

[[provider]]
name = "perplexity"
display_name = "Perplexity"
base_url = "https://api.perplexity.ai"
api_key_env = "PERPLEXITY_API_KEY"
compatible_with = "openai"
default_model = "sonar"
models = ["sonar", "sonar-pro", "sonar-reasoning"]

[[provider]]
name = "openrouter"
display_name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
compatible_with = "openai"
default_model = "auto"
models = ["auto"]

[[provider]]
name = "together"
display_name = "Together AI"
base_url = "https://api.together.xyz/v1"
api_key_env = "TOGETHER_API_KEY"
compatible_with = "openai"
default_model = "meta-llama/Llama-3.3-70B-Instruct-Turbo"
models = ["meta-llama/Llama-3.3-70B-Instruct-Turbo", "mistralai/Mixtral-8x22B-Instruct-v0.1"]

[[provider]]
name = "lmstudio"
display_name = "LM Studio"
base_url = "http://localhost:1234/v1"
api_key_env = ""
compatible_with = "openai"
default_model = "local"
models = ["local"]

[[provider]]
name = "vllm"
display_name = "vLLM"
base_url = "http://localhost:8000/v1"
api_key_env = ""
compatible_with = "openai"
default_model = "default"
models = ["default"]

[[provider]]
name = "deepinfra"
display_name = "DeepInfra"
base_url = "https://api.deepinfra.com/v1/openai"
api_key_env = "DEEPINFRA_API_KEY"
compatible_with = "openai"
default_model = "meta-llama/Llama-3.3-70B-Instruct"
models = ["meta-llama/Llama-3.3-70B-Instruct"]

[[provider]]
name = "sambanova"
