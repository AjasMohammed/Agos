# Hardware Safety Rules
#
# Operator-defined rules evaluated by the kernel BEFORE any IoT actuator command.
# These rules are written in Rust — the LLM cannot override them.
#
# Condition types:
#   reported_threshold — compare a sensor's reported value against a threshold
#   time_window — restrict actions to certain hours of the day
#
# Uncomment and customize rules for your deployment.

# [[rules]]
# name = "thermal_protection"
# description = "Block heater activation when ambient temperature is high"
# device_type = "heater"
# action = "set_state"
# condition_type = "reported_threshold"
# sensor_device_id = "thermal_sensor_1"
# field = "temperature"
# op = "lt"
# threshold = 75.0
# error_message = "Cannot activate heater: ambient temperature too high"
# escalation = false

# [[rules]]
# name = "night_lock"
# description = "Prevent door unlocking between 11PM and 6AM"
# device_type = "door_lock"
# action = "unlock"
# condition_type = "time_window"
# allowed_start_hour = 6
# allowed_end_hour = 23
# error_message = "Door unlock blocked by night lock policy (11PM-6AM)"
# escalation = true
