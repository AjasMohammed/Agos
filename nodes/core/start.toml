[node]
id = "start"
version = 1
display_name = "Start"
description = "Entry point of the workflow. Every workflow must have exactly one Start node."
category = "core"
icon = "play-circle"
color = "#22c55e"
risk_class = ""

[[node.inputs]]
kind = "main"
required = false

[[node.outputs]]
kind = "main"

[[node.properties]]
name = "trigger"
display_name = "Trigger Mode"
type = "options"
required = true
description = "How this workflow is triggered."

  [[node.properties.options]]
  value = "manual"
  label = "Manual"

  [[node.properties.options]]
  value = "schedule"
  label = "Schedule"

  [[node.properties.options]]
  value = "webhook"
  label = "Webhook"

  [[node.properties.options]]
  value = "event"
  label = "Event Bus"

[node.execute]
kind = "builtin"
name = "start"
